name: CI

on:
  push:
  pull_request:

jobs:
  simulate:
    name: VHDL simulation (GHDL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GHDL
        run: sudo apt-get update && sudo apt-get install -y ghdl
      - name: Run self-checking testbench
        run: make sim

  model:
    name: Reference model (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: make model
